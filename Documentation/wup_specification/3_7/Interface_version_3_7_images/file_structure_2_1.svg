<svg xmlns="http://www.w3.org/2000/svg" width="650" height="340"
     viewBox="0 0 650 340"
     font-family="Arial, sans-serif" font-size="11" fill="#000">

  <!-- Box 1: File header (level 0) -->
  <rect x="5"  y="5"   width="640" height="36" fill="#f5f5f5" stroke="#333" stroke-width="0.8"/>
  <text x="10" y="22"  font-weight="bold">File header:</text>
  <text x="10" y="36">VERSION, ANR, ELB, ELN, ZNR, REIHE, ELA, ELM, WNP, CAD, CADRELEASE</text>

  <!-- Box 2: RT optional (level 1) -->
  <rect x="22" y="46" width="623" height="22" fill="#fafafa" stroke="#555" stroke-width="0.7" stroke-dasharray="4,2"/>
  <text x="27" y="61" font-style="italic">Optional: Definition of unprocessed parts: RT</text>

  <!-- Box 3: (A) Framework components (level 2) -->
  <rect x="39" y="73" width="606" height="38" fill="white" stroke="#333" stroke-width="0.8"/>
  <text x="44" y="89" font-weight="bold">(A)</text>
  <text x="62" y="89">Definition of framework components, introduced by the definition of a component:</text>
  <text x="44" y="103">UG, OG, LS, QS, BT4, BT6, EBT, BTn</text>

  <!-- Box 4: PROPERTY (level 3) -->
  <rect x="56" y="116" width="589" height="22" fill="white" stroke="#555" stroke-width="0.6"/>
  <text x="61" y="131">Attributes of a component: PROPERTY</text>

  <!-- Box 5: Component processing steps (level 3) -->
  <rect x="56" y="143" width="589" height="38" fill="white" stroke="#555" stroke-width="0.6"/>
  <text x="61" y="158">Component processing steps: UNIT, SG, PSG, TA, KN, MPL, PAF, PZF, PSF, SZ</text>
  <text x="61" y="173">Spatial processing plane RBE / RBE2, followed by component processing steps</text>

  <!-- Box 6: (B) Component positions (level 2) -->
  <rect x="39" y="186" width="606" height="38" fill="white" stroke="#333" stroke-width="0.8"/>
  <text x="44" y="202" font-weight="bold">(B)</text>
  <text x="62" y="202">Definition of component positions, introduced by layered components of the same type:</text>
  <text x="44" y="216">PLI0...PLI10, PLA0...PLA10</text>

  <!-- Box 7: Layer processing steps (level 3) -->
  <rect x="56" y="229" width="589" height="38" fill="white" stroke="#555" stroke-width="0.6"/>
  <text x="61" y="244">Layer processing steps: UNIT, PSG, PAF, PSF, NR, NBR, PSZ, PML, PAL, KN</text>
  <text x="61" y="259">Spatial processing plane RBE / RBE2, followed by corresponding processing steps</text>

  <!-- Box 8: (C) Modules (level 2) -->
  <rect x="39" y="272" width="606" height="22" fill="white" stroke="#333" stroke-width="0.8"/>
  <text x="44" y="287" font-weight="bold">(C)</text>
  <text x="62" y="287">Definition of modules: MODUL, ENDMODUL</text>

  <!-- Box 9: C contents (level 3) -->
  <rect x="56" y="299" width="589" height="22" fill="white" stroke="#555" stroke-width="0.6"/>
  <text x="61" y="314">Definition of component positions (B) or framework components (A)</text>

  <!-- Note at bottom -->
  <text x="5" y="333" font-size="9.5" fill="#444" font-style="italic">Multiple specifications of (A), (B), or (C) are possible. A definition ends when a new definition begins.</text>
</svg>
